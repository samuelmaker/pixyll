<script>
    var contactForm = document.querySelector('form'),
    inputEmail = contactForm.querySelector('[name="email"]'),
    textAreaMessage = contactForm.querySelector('[name="content"]'),
    sendButton = contactForm.querySelector('button');

    sendButton.addEventListener('click', function(event){
      event.preventDefault();

      sendButton.textContent = {{ site.text.contact.ajax.sending | default: "sending..." | jsonify | replace: '<', '\u003c' | replace: '>', '\u003e' | replace: '&', '\u0026' }};

      var xhr = new XMLHttpRequest();
      xhr.open('POST', {{ site.email | prepend: 'https://formspree.io/' | jsonify | replace: '<', '\u003c' | replace: '>', '\u003e' | replace: '&', '\u0026' }}, true);
      xhr.setRequestHeader("Accept", "application/json")
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded")

      xhr.send(
        "email=" + encodeURIComponent(inputEmail.value) +
        "&message=" + encodeURIComponent(textAreaMessage.value));

      xhr.onloadend = function (res) {
        if (res.target.status === 200){
          sendButton.textContent = {{ site.text.contact.ajax.sent | default: "Message sent!" | jsonify | replace: '<', '\u003c' | replace: '>', '\u003e' | replace: '&', '\u0026' }};
        }
        else {
          sendButton.textContent = {{ site.text.contact.ajax.error | default: "Error!" | jsonify | replace: '<', '\u003c' | replace: '>', '\u003e' | replace: '&', '\u0026' }};
        }
      }
    });
</script>
